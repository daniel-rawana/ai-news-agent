<!DOCTYPE html>
<html>

<head>
    <title>News Agent Title</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='AgentPageIndexStyle.css') }}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .agent-container {
                max-width: 800px;
                margin: 50px auto;
                padding: 30px;
                background: rgba(255, 255, 255, 0.95);
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            .agent-container h2 {
                margin-bottom: 15px;
                line-height: 1.5;
            }

            .agent-container p {
                margin-bottom: 25px;
                line-height: 1.6;
            }

            .agent-container h3 {
                margin-bottom: 15px;
                line-height: 1.5;
            }

            .agent-form {
                margin-bottom: 30px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
                font-size: 16px;
            }

            .form-group select {
                width: 100%;
                padding: 12px;
                font-size: 16px;
                border: 2px solid #ddd;
                border-radius: 5px;
                background-color: white;
            }

            .generate-btn {
                width: 100%;
                padding: 15px;
                font-size: 18px;
                font-weight: bold;
                color: white;
                background-color: #007bff;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background-color 0.3s;
            }

            .generate-btn:hover:not(:disabled) {
                background-color: #0056b3;
            }

            .generate-btn:disabled {
                background-color: #6c757d;
                cursor: not-allowed;
            }

            .status-container {
                margin-top: 30px;
                padding: 40px 20px;
                background: #f8f9fa;
                border-radius: 5px;
                display: none;
                text-align: center;
            }

            .status-container.active {
                display: block;
            }

            .loading-spinner {
                width: 80px;
                height: 80px;
                margin: 0 auto 30px;
                border: 8px solid #f3f3f3;
                border-top: 8px solid #007bff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .status-text {
                font-size: 16px;
                color: #555;
                margin-top: 20px;
            }

            .video-container {
                margin-top: 30px;
                display: none;
            }

            .video-container.active {
                display: block;
            }

            .video-container video {
                width: 100%;
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            .error-message {
                margin-top: 20px;
                padding: 15px;
                background: #f8d7da;
                border: 1px solid #f5c6cb;
                border-radius: 5px;
                color: #721c24;
                display: none;
            }

            .error-message.active {
                display: block;
            }
        </style>
</head>

<body>

    <div class="backgroundImage">
    <nav>
        <div class="nav-left">
            <img class="logo" src="{{HermesLogo}}" alt="Page Logo">
            <img class="namelogo" src="{{HermesName}}" alt="Page Name">
        </div>
        <ul class="nav-right">
            <li><a href="/">Today</a></li>
            <li><a href="/previousnews">News</a></li>
            <li><a href="/team">About Us</a></li>
            <li><a href="/agent">Agent</a></li>
            <li><button onclick="toggle()">Theme</button></li>
        </ul>
    </nav>

    <div class="agent-container">
        <h2>Generate News Video</h2>
        <p>Select a news category and generate a custom AI news video.</p>

        <form class="agent-form" id="agentForm">
            <div class="form-group">
                <label for="category">News Category:</label>
                <select id="category" name="category" required>
                    <option value="general">General</option>
                    <option value="business">Business</option>
                    <option value="technology">Technology</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="health">Health</option>
                    <option value="science">Science</option>
                    <option value="sports">Sports</option>
                </select>
            </div>

            <button type="submit" class="generate-btn" id="generateBtn">
                Generate Video
            </button>
        </form>

        <div class="status-container" id="statusContainer">
            <div class="loading-spinner"></div>
            <div class="status-text" id="statusText">Initializing pipeline...</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="video-container" id="videoContainer">
            <h3>Generated Video</h3>
            <video id="generatedVideo" controls></video>
        </div>
    </div>

    <script>
        const form = document.getElementById('agentForm');
        const generateBtn = document.getElementById('generateBtn');
        const statusContainer = document.getElementById('statusContainer');
        const statusSteps = document.getElementById('statusSteps');
        const videoContainer = document.getElementById('videoContainer');
        const generatedVideo = document.getElementById('generatedVideo');
        const errorMessage = document.getElementById('errorMessage');

        const statusMessages = {
            'starting': 'Initializing pipeline...',
            'news_fetched': 'Fetching news articles...',
            'script_generated': 'Generating news script...',
            'voiceover_created': 'Creating voiceover...',
            'boundaries_detected': 'Detecting story boundaries...',
            'thumbnails_generated': 'Generating thumbnails...',
            'video_created': 'Creating video...',
            'completed': 'Finalizing and uploading...'
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const category = document.getElementById('category').value;

            // Reset UI
            statusContainer.classList.add('active');
            videoContainer.classList.remove('active');
            errorMessage.classList.remove('active');
            document.getElementById('statusText').textContent = 'Initializing pipeline...';
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';

            try {
                // Start the video generation
                const response = await fetch('/agent/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ category })
                });

                if (!response.ok) {
                    throw new Error('Failed to start video generation');
                }

                const data = await response.json();
                const taskId = data.task_id;

                // Poll for status updates
                const pollInterval = setInterval(async () => {
                    try {
                        const statusResponse = await fetch(`/agent/status/${taskId}`);

                        if (!statusResponse.ok) {
                            clearInterval(pollInterval);
                            showError('Failed to get status update');
                            resetButton();
                            return;
                        }

                        const statusData = await statusResponse.json();
                        console.log('Status update:', statusData);

                        if (statusData.status === 'error') {
                            clearInterval(pollInterval);
                            showError(statusData.message || 'An error occurred');
                            resetButton();
                            return;
                        }

                        // Update step status
                        updateStepStatus(statusData.status);

                        if (statusData.status === 'completed') {
                            clearInterval(pollInterval);
                            showVideo(statusData.video_url);
                            resetButton();
                        }
                    } catch (error) {
                        console.error('Polling error:', error);
                        clearInterval(pollInterval);
                        showError('Connection to server lost. Please try again.');
                        resetButton();
                    }
                }, 2000); // Poll every 2 seconds

            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
                resetButton();
            }
        });

        function updateStepStatus(status) {
            const statusText = document.getElementById('statusText');
            if (statusMessages[status]) {
                statusText.textContent = statusMessages[status];
            }
        }

        function showVideo(videoUrl) {
            generatedVideo.src = videoUrl;
            videoContainer.classList.add('active');
            statusContainer.classList.remove('active');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }

        function resetButton() {
            generateBtn.disabled = false;
            generateBtn.textContent = 'Generate Video';
        }
    </script>
    </div>
</body>
</html>
