<!DOCTYPE html>
<html>
  <head>
    <title>Featured Video</title>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      type="text/css"
      href="../static/AgentPageIndexStyle.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="../static/AgentPagePreviousNewsStyle.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      /* Responsive video container to auto-fit any video */
      .video-container {
        position: relative;
        width: 100%;
        max-width: 900px;
        margin: auto;
        padding-bottom: 56.25%; /* 16:9 ratio */
        height: 0;
      }

      .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .video-description {
        max-width: 900px;
        margin: 20px auto;
        padding: 0 10px;
        text-align: left;
      }
    </style>
  </head>

  <body>
    <h1>
      <img
        class="logo"
        src="{{HermesLogo}}"
        alt="Page Logo"
        width="200"
        height="150"
      />
      <img
        class="namelogo"
        src="{{HermesName}}"
        alt="Page Name"
        width="400"
        height="100"
      />
      <button onclick="toggle()">Theme</button>
    </h1>

    <nav>
      <ul>
        <li><a href="/">Today</a></li>
        <li><a href="/previousnews">News</a></li>
        <li><a href="/team">About Us</a></li>
      </ul>
    </nav>

    <main>
      <div class="video-container">
        <iframe
          src="{{video}}"
          title="Video Player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>

      <div class="video-description">
        <h2>About This Video</h2>
        <p>Giggity</p>
      </div>
    </main>

    <script src="{{ url_for('static', filename='index.js') }}"></script>
  </body>
</html>
